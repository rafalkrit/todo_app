[pytest]
minversion = "9.0"
strict = true
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
  "-ra",
  "-q",
  "--maxfail=1",
  "--cov=src",
  "--cov-report=term-missing:skip-covered",
  "--cov-report=xml:coverage.xml",
  "--cov-fail-under=100"
]
filterwarnings = [
  "error::DeprecationWarning",
  "error::FutureWarning",
  "ignore::DeprecationWarning:pkg_resources",
]
