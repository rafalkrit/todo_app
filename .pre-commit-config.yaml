minimum_pre_commit_version: "4.4.0"

default_language_version:
  python: python3

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.5
    hooks:
      - id: ruff-format
        stages: [pre-commit]

      - id: ruff-check
        args: [--fix]
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: ty
        name: ty (type-check)
        language: python
        pass_filenames: false
        additional_dependencies: ["ty"]
        entry: python -m ty check
        stages: [pre-commit]

      - id: pytest
        name: pytest (smoke on push)
        language: python
        pass_filenames: false
        additional_dependencies: ["pytest", "coverage", "pytest-cov"]
        entry: pytest -q
        stages: [pre-push]
