<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="100%" stop-color="#111318"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c6cf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7c6cf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accent-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c6cf8"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="url(#bg)" rx="12"/>

  <!-- Grid lines horizontal -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="0.5">
    <line x1="0" y1="40"  x2="900" y2="40"/>
    <line x1="0" y1="80"  x2="900" y2="80"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
  </g>

  <!-- Grid lines vertical -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="0.5">
    <line x1="90"  y1="0" x2="90"  y2="200"/>
    <line x1="180" y1="0" x2="180" y2="200"/>
    <line x1="270" y1="0" x2="270" y2="200"/>
    <line x1="360" y1="0" x2="360" y2="200"/>
    <line x1="450" y1="0" x2="450" y2="200"/>
    <line x1="540" y1="0" x2="540" y2="200"/>
    <line x1="630" y1="0" x2="630" y2="200"/>
    <line x1="720" y1="0" x2="720" y2="200"/>
    <line x1="810" y1="0" x2="810" y2="200"/>
  </g>

  <!-- Glow ellipse -->
  <ellipse cx="450" cy="100" rx="320" ry="100" fill="url(#glow)"/>

  <!-- Bottom accent line -->
  <rect x="0" y="196" width="900" height="4" fill="url(#accent-line)" rx="2"/>

  <!-- Main title -->
  <text x="450" y="90" text-anchor="middle"
        font-family="'Segoe UI', system-ui, sans-serif"
        font-size="72" font-weight="800" letter-spacing="-3"
        fill="#e8eaf0">Todo</text>
  <text x="450" y="90" text-anchor="middle"
        font-family="'Segoe UI', system-ui, sans-serif"
        font-size="72" font-weight="800" letter-spacing="-3"
        fill="#7c6cf8" opacity="0">Todo</text>

  <!-- "App" word in accent -->
  <text x="450" y="156" text-anchor="middle"
        font-family="'Segoe UI', system-ui, sans-serif"
        font-size="28" font-weight="400" letter-spacing="12"
        fill="#6b7280">APP</text>

  <!-- Left terminal decoration -->
  <rect x="32" y="76" width="120" height="52" rx="6"
        fill="#161920" stroke="#ffffff" stroke-opacity="0.08" stroke-width="0.5"/>
  <circle cx="45" cy="90" r="4" fill="#ff5f57"/>
  <circle cx="58" cy="90" r="4" fill="#ffbd2e"/>
  <circle cx="71" cy="90" r="4" fill="#28ca41"/>
  <text x="40" y="110" font-family="'Courier New', monospace" font-size="9" fill="#4ade80">$ uv run</text>
  <text x="40" y="122" font-family="'Courier New', monospace" font-size="9" fill="#94a3b8">python main.py</text>

  <!-- Right stats decoration -->
  <rect x="748" y="68" width="120" height="68" rx="6"
        fill="#161920" stroke="#ffffff" stroke-opacity="0.08" stroke-width="0.5"/>
  <text x="808" y="90" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#6b7280">COVERAGE</text>
  <text x="808" y="110" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#4ade80">100%</text>
  <text x="808" y="126" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#6b7280">PYTHON 3.13</text>

  <!-- Dot indicator -->
  <circle cx="450" cy="178" r="3" fill="#4ade80"/>
  <text x="460" y="182" font-family="'Courier New', monospace" font-size="9" fill="#4ade80">active</text>
</svg>
